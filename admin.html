<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lina | Yönetim Paneli</title><style>
:root{font-family:system-ui,Arial;color:#12344a;background:#f2f7f9}*{box-sizing:border-box}body{margin:0}header{background:#102c43;color:white;padding:20px max(20px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between}main{max-width:1100px;margin:28px auto;padding:0 18px}h1{font-size:24px}h2{font-size:19px}section{background:white;padding:24px;border-radius:16px;margin:20px 0;box-shadow:0 4px 25px #153d4d0e}label{display:block;font-weight:650;font-size:13px;margin:14px 0 5px}input,textarea{width:100%;padding:12px;border:1px solid #c8d9df;border-radius:9px;font:inherit}textarea{min-height:90px}button{background:#008d85;border:0;color:white;padding:11px 17px;border-radius:9px;font-weight:700;cursor:pointer;margin:7px 5px 7px 0}button.danger{background:#b63442}button.secondary{background:#395a70}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.item{border:1px solid #e1e9ec;padding:13px;border-radius:12px}.item img{width:100%;height:150px;object-fit:cover;border-radius:8px}.muted{color:#657986;font-size:13px}#status{padding:10px;border-radius:9px;min-height:20px}#status.error{background:#ffe5e5;color:#8b2020}#status.ok{background:#e4f8ed;color:#165f36}[hidden]{display:none!important}@media(max-width:600px){section{padding:16px}header{padding:16px}}
</style></head><body><header><strong>LINA ✦ Yönetim Paneli</strong><button id="logout" class="secondary" hidden>Çıkış Yap</button></header><main><div id="status" role="status" aria-live="polite"></div>
<section id="loginPanel"><h1>Yönetici Girişi</h1><p class="muted">Yalnızca yetkili Lina yöneticileri giriş yapabilir.</p><form id="loginForm"><label>E-posta</label><input id="email" type="email" required autocomplete="username"><label>Şifre</label><input id="password" type="password" required autocomplete="current-password"><button>Giriş Yap</button></form></section>
<div id="dashboard" hidden><h1>Site Yönetimi</h1><section><h2>Site Bilgileri</h2><form id="settingsForm"><label>Ana sayfa başlığı</label><input id="hero_title" maxlength="200"><label>Ana sayfa açıklaması</label><textarea id="hero_description"></textarea><label>Hakkımızda açıklaması</label><textarea id="about_description"></textarea><label>WhatsApp numarası (ülke koduyla)</label><input id="phone" inputmode="tel"><button>Bilgileri Kaydet</button></form></section>
<section><h2>Hizmetler</h2><p class="muted">Hizmet adlarını, görsellerini ve sıralamasını yönetin.</p><div id="services" class="grid"></div><h3>Yeni Hizmet</h3><form id="serviceForm"><label>Hizmet adı</label><input id="newService" required maxlength="120"><label>Görsel URL'si (isteğe bağlı)</label><input id="newServiceImage" placeholder="https://..."><button>Hizmet Ekle</button></form></section>
<section><h2>Fotoğraf Galerisi</h2><p class="muted">JPG, PNG veya WebP. En fazla 10 MB. Fotoğraflar kalıcı depolanır.</p><form id="uploadForm"><label>Fotoğraf seç</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" required><label>Fotoğraf açıklaması</label><input id="caption" maxlength="200"><button>Fotoğraf Yükle</button></form><div id="gallery" class="grid"></div></section></div></main>
<script src="lina-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="admin.js" defer></script></body></html>
